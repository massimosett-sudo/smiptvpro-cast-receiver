<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIPTVPro Custom Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #000000; overflow: hidden; }
        cast-media-player { width: 100%; height: 100%; --theme-hue: 0; }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>
<script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const manager = context.getPlayerManager();

    // 1. CONFIGURAZIONE AVANZATA DEL LETTORE PER FLUSSI IPTV INSTABILI
    const playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.autoResumeDuration = 5;
    playbackConfig.withCredentials = true; 
    playbackConfig.manifestRequestHandler = requestInfo => { requestInfo.withCredentials = true; };
    playbackConfig.segmentRequestHandler = requestInfo => { requestInfo.withCredentials = true; };

    // TWEAKS FONDAMENTALI PER I FILE .TS: Forza il lettore interno (Shaka) a tollerare disallineamenti audio/video
    playbackConfig.shakaConfig = {
        streaming: {
            jumpLargeGaps: true,          // Salta i vuoti temporali nel flusso senza bloccare il player
            ignoreTextStreamFailures: true // Ignora errori nei sottotitoli che spesso fanno crashare i canali TS
        },
        manifest: {
            retryParameters: {
                maxAttempts: 4,
                baseDelay: 1000,
                backoffFactor: 2
            }
        }
    };

    // 2. INTERCETTAZIONE E CORREZIONE DEL CARICAMENTO
    manager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        request => {
            if (!request.media) return request;

            const url         = (request.media.contentId || request.media.contentUrl || '').toLowerCase();
            const contentType = (request.media.contentType || '').toLowerCase();

            // Identificazione estesa dei canali Live in formato MPEG-TS
            const isTs = url.includes('.ts')
                      || contentType === 'video/mp2t'
                      || url.includes('/ts/')
                      || url.match(/\/(live|stream)\//);

            if (isTs) {
                request.media.contentType      = 'video/mp2t';
                // Comunichiamo al Chromecast di trattarlo come un flusso LIVE continuo, riducendo la rigidità del buffer
                request.media.streamType       = cast.framework.messages.StreamType.LIVE;
                request.media.hlsSegmentFormat = cast.framework.messages.HlsSegmentFormat.TS;
            }

            const isHls = url.includes('.m3u8') || contentType === 'application/x-mpegurl';
            if (isHls) {
                request.media.contentType = 'application/x-mpegurl';
                request.media.streamType  = cast.framework.messages.StreamType.LIVE;
            }

            return request;
        }
    );

    // 3. RECUPERO AGGRESSIVO IN CASO DI ERRORE DI RETE O PACCHETTI CORROTTI
    manager.addEventListener(cast.framework.events.EventType.ERROR, event => {
        console.error('Errore rilevato sul ricevitore:', event.detailedErrorCode, event);

        const recoverableCodes = [
            cast.framework.events.DetailedErrorCode.MEDIA_UNKNOWN,
            cast.framework.events.DetailedErrorCode.NETWORK,
            cast.framework.events.DetailedErrorCode.SEGMENT_NETWORK,
            cast.framework.events.DetailedErrorCode.MANIFEST_NETWORK,
            cast.framework.events.DetailedErrorCode.HLS_NETWORK_MASTER_PLAYLIST,
            cast.framework.events.DetailedErrorCode.DECODE
        ];

        if (recoverableCodes.includes(event.detailedErrorCode)) {
            console.log('Tentativo di ricaricamento del flusso IPTV...');
            setTimeout(() => {
                const mediaInfo = manager.getMediaInformation();
                if (mediaInfo) {
                    const loadReq = new cast.framework.messages.LoadRequestData();
                    loadReq.media       = mediaInfo;
                    loadReq.autoplay    = true;
                    loadReq.currentTime = 0;
                    manager.load(loadReq);
                }
            }, 1500); // Ridotto a 1.5 secondi per un riavvio più rapido
        }
    });

    context.start({
        touchScreenOptimizedApp: false,
        playbackConfig: playbackConfig
    });
</script>
</body>
</html>
