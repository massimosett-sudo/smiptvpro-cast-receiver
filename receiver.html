<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMIPTVPro Receiver</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; }
video { width:100%; height:100%; object-fit:contain; }
#overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; flex-direction:column;
  justify-content:flex-end; padding:40px;
  background:linear-gradient(transparent 60%, rgba(0,0,0,0.8));
  pointer-events:none;
}
#title { color:#fff; font-size:32px; font-family:sans-serif; font-weight:bold; text-shadow:2px 2px 4px #000; }
#status { color:#aaa; font-size:20px; font-family:sans-serif; margin-top:8px; }
#spinner {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:60px; height:60px;
  border:6px solid rgba(255,255,255,0.2);
  border-top-color:#E50914;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="overlay">
  <div id="title">SMIPTVPro</div>
  <div id="status">In attesa...</div>
</div>
<div id="spinner"></div>

<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script>
const context  = cast.framework.CastReceiverContext.getInstance();
const manager  = context.getPlayerManager();
const video    = document.getElementById('video');
const titleEl  = document.getElementById('title');
const statusEl = document.getElementById('status');
const spinner  = document.getElementById('spinner');

let hlsInstance = null;

function destroyHls() {
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
}

function setStatus(msg) { statusEl.textContent = msg; }
function setTitle(t)    { titleEl.textContent  = t || 'SMIPTVPro'; }

// Intercettore del Messaggio LOAD
manager.setMessageInterceptor(
  cast.framework.messages.MessageType.LOAD,
  request => {
    if (!request || !request.media) return request;

    const media   = request.media;
    const url     = media.contentId || media.contentUrl || '';
    const mime    = (media.contentType || '').toLowerCase();
    const title   = media.metadata?.title || url.split('/').pop() || 'Canale Live';

    setTitle(title);
    setStatus('Connessione allo stream...');
    spinner.style.display = 'block';

    destroyHls();

    const isHls = mime.includes('mpegurl') || mime.includes('x-mpegurl') || url.toLowerCase().includes('.m3u8');
    const isTs  = mime.includes('mp2t') || url.toLowerCase().includes('.ts') || url.includes('output=ts');
    const isMp4 = mime.includes('mp4') || url.toLowerCase().includes('.mp4');

    // CASO 1: È un vero flusso HLS (.m3u8) -> Usa hls.js
    if (isHls) {
      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 0
        });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(e => console.log("Play bloccato:", e));
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hlsInstance.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hlsInstance.recoverMediaError();
            } else {
              destroyHls();
              setStatus('Errore fatale canale');
            }
          }
        });
        return null; // Gestito via hls.js
      }
    }

    // CASO 2: È un flusso diretto MPEG-TS (.ts) o un MP4 standard
    if (isTs || isMp4) {
      destroyHls();
      video.src = url;
      video.load();
      video.play().catch(e => setStatus('Errore riproduzione diretta'));
      return null; // Gestito inserendo la sorgente nel tag HTML5
    }

    // Se non corrisponde a nessuno, lascia fare al CAF nativo (Fallback)
    return request;
  }
);

// Eventi del player HTML5 per gestire l'interfaccia grafica
video.addEventListener('playing', () => { 
  spinner.style.display = 'none'; 
  setStatus('In onda'); 
});

video.addEventListener('waiting', () => { 
  spinner.style.display = 'block'; 
  setStatus('Buffering...'); 
});

video.addEventListener('error', () => { 
  spinner.style.display = 'none'; 
  setStatus('Errore di caricamento o CORS bloccato'); 
});

// Avvia il ricevitore
context.start({ touchScreenOptimizedApp: false });
</script>
</body>
</html>
