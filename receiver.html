<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIPTVPro Custom Receiver</title>
    
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
        }
        /* Il tag cast-media-player occupa tutto lo schermo e gestisce 
           nativamente player, scritte, buffering e grafiche */
        cast-media-player {
            width: 100%;
            height: 100%;
            --theme-hue: 0; /* Colore rosso per i controlli (stile Netflix/IPTV) */
        }
    </style>
</head>
<body>

    <cast-media-player></cast-media-player>

<script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const manager = context.getPlayerManager();

    // Intercettiamo la richiesta di LOAD prima che il Chromecast provi a riprodurla
    manager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        request => {
            if (request.media && request.media.contentId) {
                const url = request.media.contentId.toLowerCase();
                
                // Forza la compatibilità se l'URL è un file .ts o se ha il mime-type dei flussi MPEG-TS
                if (url.includes('.ts') || request.media.contentType === 'video/mp2t') {
                    
                    // 1. Indica a Chromecast di usare il demuxer hardware interno per i flussi MPEG-TS
                    request.media.contentType = 'video/mp2t';
                    
                    // 2. Comunica che si tratta di una diretta (LIVE). Fondamentale per l'IPTV
                    request.media.streamType = cast.framework.messages.StreamType.LIVE;
                    
                    // 3. Disabilita il cambio di traccia audio/sottotitoli automatico che spesso corrompe i flussi live .ts
                    request.media.hlsSegmentFormat = cast.framework.messages.HlsSegmentFormat.TS;
                }
            }
            
            // Ritorna la richiesta modificata al sistema. 
            // IMPORTANTE: NON ritornare mai null, altrimenti il cast si scollega!
            return request;
        }
    );

    // Gestione degli errori per evitare che il player si blocchi a schermo nero in caso di micro-interruzioni
    manager.addEventListener(cast.framework.events.EventType.ERROR, event => {
        console.error('Errore di riproduzione intercettato:', event);
        // Forza il superamento dell'errore se il flusso live perde un pacchetto
        if (event.detailedErrorCode === cast.framework.events.DetailedErrorCode.MEDIA_UNKNOWN) {
            manager.play();
        }
    });

    // Avvia il ricevitore ottimizzato per la TV (senza interfacce touch forzate)
    context.start({ touchScreenOptimizedApp: false });
</script>
</body>
</html>
